# NOTE: In the GitHub repo, set Settings -> Pages -> Source to "GitHub Actions"
# before this workflow can publish the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vitest unit tests
        run: npx vitest run

      - name: Build static export for GitHub Pages
        run: npm run build:pages

      - name: Verify base path and CSP in out/index.html
        run: |
          grep -q '/ghostdocs/_next/' out/index.html || { echo "Missing /ghostdocs/_next/ base path in out/index.html"; exit 1; }
          grep -q 'Content-Security-Policy' out/index.html || { echo "Missing Content-Security-Policy in out/index.html"; exit 1; }

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
